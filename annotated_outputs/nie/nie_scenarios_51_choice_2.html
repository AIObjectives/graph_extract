		physics: {			
			enabled: true,			
			barnesHut: {			
			theta: 0.5,			
			gravitationalConstant: -5000,			
			springLength: 500,			
			springConstant: 0.01,			
			damping: 5,			
			avoidOverlap: 1

			addEdge: true,

			font: { size: 16 },            
			},         
		edges: {         
			length: 2000,         
		},	};

	var network = new vis.Network(container, data, options);
