		physics: {			
			enabled: true,			
			barnesHut: {			
			theta: 0.5,

			springLength: 500,			
			springConstant: 0.01,			
			damping: 5,			
			avoidOverlap: 1

			addEdge: true,

			deleteNode: true,

			},         
		edges: {

		},	};
