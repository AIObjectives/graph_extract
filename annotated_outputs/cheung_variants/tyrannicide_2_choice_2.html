<html>
<head>
<script type='text/javascript'src='https://unpkg.com/vis-network/standalone/umd/vis-network.min.js'></script>    
<style type='text/css'>      
 #mynetwork {        
		width: 1200px;         
		height: 1200px;         
		border: 1px solid lightgray;       
	 }   
	 </style>
</head>
<body>
<div id='mynetwork'></div>

<script type="text/javascript">    

window.onload = function(){       
	launch_visualization()    
}    
function launch_visualization() {         
	this_dset =  return_vis_dataset()        
	nodes = this_dset[1]        
	edges = this_dset[0]        
	// create a network        
	var container = document.getElementById("mynetwork");        
	var data = {            
		nodes: nodes,            
		 edges: edges         
		};    
	var options = {		
		physics: {			
			enabled: true,			
			barnesHut: {			
			theta: 0.5,			
			gravitationalConstant: -5000,			
			springLength: 500,			
			springConstant: 0.01,			
			damping: 5,			
			avoidOverlap: 1			
		}		
	},		
		manipulation: {			
			enabled: true,			
			initiallyActive: false,			
			addNode: true,			
			addEdge: true,			
			editEdge: true,			
			deleteNode: true,			
			deleteEdge: true,		
			},		
		nodes: {			
			shape: "circle",            
			font: { size: 16 },            
			},         
		edges: {         
			length: 2000,         
		},	};        
 // initialize your network!         
	var network = new vis.Network(container, data, options);    
}
function return_vis_dataset() {
	var nodes = new vis.DataSet([ 
		{id: 1, label: "1 army officer narrator", color: {background: '#279aba'}},
		{id: 2, label: "6 co-conspirators", color: {background: '#279aba'}},
		{id: 3, label: "1 dictator", color: {background: '#279aba'}},
		{id: 4, label: "unknown number of the dictator's\n family members, excluding the dictator", color: {background: '#279aba'}},
		{id: 5, label: "unknown number of the dictator's\n non-family followers", color: {background: '#279aba'}},
		{id: 6, label: "unknown number of other people\n in the dominican republic at\n risk of regime killings because\n of their ethnicity or political\n views, excluding the above", color: {background: '#279aba'}},
		{id: 7, label: "unknown number of other people\n in the dominican republic not\n in the above groups", color: {background: '#279aba'}},
		{id: 8, label: "i", color: {background: '#279aba'}},
		{id: 9, label: "", color: {background: '#ba2769'}},
		{id: 10, label: "value", color: {background: '#8e7db5'}}
		]);
	var edges = new vis.DataSet([ 
		{from: 8, to: 9, label: "C+I+K+", color: {color: '#62a3a2', highlight: '#f540e6'}, font: { size: 18 }, arrows: { to: { enabled: true, type: 'arrow'}}},
		{from: 9, to: 10, label: "-7.0", color: {color: '#b518a8', highlight: '#f540e6'}, font: { size: 18 }, arrows: { to: { enabled: true, type: 'arrow'}}},
		]);

	return ([edges,nodes])
}
</script>
</body>
</html>
