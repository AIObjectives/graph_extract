		physics: {			
			enabled: true,			
			barnesHut: {			
			theta: 0.5,			
			gravitationalConstant: -5000,			
			springLength: 500,			
			springConstant: 0.01,			
			damping: 5,			
			avoidOverlap: 1

			addNode: true,			
			addEdge: true,

			deleteNode: true,

			},         
		edges: {         
			length: 2000,         
		},	};
