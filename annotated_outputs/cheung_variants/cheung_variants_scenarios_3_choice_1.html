		nodes: nodes,            
		 edges: edges         
		};

		physics: {			
			enabled: true,			
			barnesHut: {			
			theta: 0.5,

			springLength: 500,			
			springConstant: 0.01,			
			damping: 5,			
			avoidOverlap: 1

			},         
		edges: {         
			length: 2000,         
		},	};        
 // initialize your network!         
	var network = new vis.Network(container, data, options);
